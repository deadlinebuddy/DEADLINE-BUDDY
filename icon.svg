        y="335"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="230"
        font-weight="900"
        letter-spacing="-20"
        fill="white"
        filter="url(#shadow)"
    >
        DB
    </text>


    <circle
        cx="374"
        cy="356"
        r="48"
        fill="white"
    />


    <path
        d="M350 356 L368 374 L402 337"
        fill="none"
        stroke="#5b4bdb"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round"
    />


    <path
        d="M362 110 L375 74"
        stroke="#ffffff"
        stroke-width="15"
        stroke-linecap="round"
        opacity="0.85"
    />

    <path
        d="M408 125 L435 96"
        stroke="#ffffff"
        stroke-width="15"
        stroke-linecap="round"
        opacity="0.85"
    />

    <path
        d="M437 161 L473 150"
        stroke="#ffffff"
        stroke-width="15"
        stroke-linecap="round"
        opacity="0.85"
    />

</svg>
