<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512"
>

    <defs>

        <linearGradient
            id="bg"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%"
        >

            <stop
                offset="0%"
                stop-color="#6d5ce7"
            />

            <stop
                offset="100%"
                stop-color="#4b3bc7"
            />

        </linearGradient>

        <filter
            id="shadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%"
        >

            <feDropShadow
                dx="0"
                dy="12"
                stdDeviation="10"
                flood-opacity="0.18"
            />

        </filter>

    </defs>


    <rect
        width="512"
        height="512"
        rx="115"
        fill="url(#bg)"
    />


    <text
