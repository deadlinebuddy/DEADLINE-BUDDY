<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512"
>

    <defs>

        <!-- Main gradient -->
        <linearGradient
            id="bgGradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop
                offset="0%"
                stop-color="#7567ef"
            />

            <stop
                offset="55%"
                stop-color="#5b4bdb"
            />

            <stop
                offset="100%"
                stop-color="#4032a9"
            />
        </linearGradient>


        <!-- Highlight -->
        <linearGradient
            id="shine"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop
                offset="0%"
                stop-color="#ffffff"
                stop-opacity="0.35"
            />

            <stop
                offset="100%"
                stop-color="#ffffff"
                stop-opacity="0"
            />
        </linearGradient>


        <!-- Shadow -->
        <filter
            id="shadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%"
        >

            <feDropShadow
                dx="0"
                dy="12"
                stdDeviation="14"
                flood-color="#29234f"
                flood-opacity="0.25"
            />

        </filter>

    </defs>


    <!-- OUTER APP ICON -->

    <rect
        x="20"
        y="20"
        width="472"
        height="472"
        rx="115"
        fill="url(#bgGradient)"
        filter="url(#shadow)"
    />


    <!-- TOP SHINE -->

    <path
        d="
            M 60 160
            Q 100 55 230 45
            Q 360 35 450 100
            L 450 180
            Q 330 125 60 180
            Z
        "
        fill="url(#shine)"
    />


    <!-- DECORATIVE CIRCLES -->

    <circle
        cx="100"
        cy="105"
        r="16"
        fill="#ffffff"
        opacity="0.18"
    />

    <circle
        cx="415"
        cy="120"
        r="11"
        fill="#ffffff"
        opacity="0.25"
    />

    <circle
        cx="405"
        cy="410"
        r="18"
        fill="#ffffff"
        opacity="0.12"
    />


    <!-- INNER CARD -->

    <rect
        x="75"
        y="75"
        width="362"
        height="362"
        rx="80"
        fill="#ffffff"
        opacity="0.10"
    />


    <!-- DB BACKDROP -->

    <circle
        cx="256"
        cy="256"
        r="145"
        fill="#29234f"
        opacity="0.25"
    />


    <!-- D -->

    <text
        x="150"
        y="327"
        font-family="Arial, Helvetica, sans-serif"
        font-size="205"
        font-weight="900"
        fill="#ffffff"
        letter-spacing="-20"
    >
        D
    </text>


    <!-- B -->

    <text
        x="255"
        y="327"
        font-family="Arial, Helvetica, sans-serif"
        font-size="205"
        font-weight="900"
        fill="#ffffff"
        letter-spacing="-20"
    >
        B
    </text>


    <!-- CHECK CIRCLE -->

    <circle
        cx="365"
        cy="365"
        r="48"
        fill="#ffffff"
    />


    <circle
        cx="365"
        cy="365"
        r="39"
        fill="#5b4bdb"
    />


    <!-- CHECK MARK -->

    <polyline
        points="
            342,365
            358,380
            390,346
        "
        fill="none"
        stroke="#ffffff"
        stroke-width="13"
        stroke-linecap="round"
        stroke-linejoin="round"
    />


    <!-- SMALL DECORATIVE LINE -->

    <rect
        x="132"
        y="360"
        width="95"
        height="10"
        rx="5"
        fill="#ffffff"
        opacity="0.35"
    />

</svg>
