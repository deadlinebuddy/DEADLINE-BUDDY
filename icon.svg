<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512"
>

    <defs>

        <linearGradient
            id="bg"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >

            <stop
                offset="0%"
                stop-color="#8178ff"
            />

            <stop
                offset="55%"
                stop-color="#635bff"
            />

            <stop
                offset="100%"
                stop-color="#443bc4"
            />

        </linearGradient>


        <linearGradient
            id="shine"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >

            <stop
                offset="0%"
                stop-color="#ffffff"
                stop-opacity="0.32"
            />

            <stop
                offset="100%"
                stop-color="#ffffff"
                stop-opacity="0"
            />

        </linearGradient>

    </defs>


    <!-- MAIN APP ICON -->

    <rect
        x="16"
        y="16"
        width="480"
        height="480"
        rx="112"
        fill="url(#bg)"
    />


    <!-- SHINE -->

    <ellipse
        cx="140"
        cy="75"
        rx="160"
        ry="65"
        fill="url(#shine)"
        transform="rotate(-18 140 75)"
    />


    <!-- DECORATIVE DOTS -->

    <circle
        cx="405"
        cy="108"
        r="13"
        fill="white"
        opacity="0.28"
    />


    <circle
        cx="95"
        cy="402"
        r="10"
        fill="white"
        opacity="0.22"
    />


    <circle
        cx="425"
        cy="405"
        r="7"
        fill="white"
        opacity="0.18"
    />


    <!-- INNER SHAPE -->

    <rect
        x="70"
        y="70"
        width="372"
        height="372"
        rx="88"
        fill="white"
        opacity="0.08"
    />


    <!-- DB BACKGROUND CIRCLE -->

    <circle
        cx="256"
        cy="256"
        r="152"
        fill="#292550"
        opacity="0.24"
    />


    <!-- D -->

    <text
        x="91"
        y="335"
        font-family="Arial, Helvetica, sans-serif"
        font-size="212"
        font-weight="900"
        fill="white"
        letter-spacing="-26"
    >
        D
    </text>


    <!-- B -->

    <text
        x="238"
        y="335"
        font-family="Arial, Helvetica, sans-serif"
        font-size="212"
        font-weight="900"
        fill="white"
        letter-spacing="-26"
    >
        B
    </text>


    <!-- CHECK BADGE -->

    <circle
        cx="390"
        cy="388"
        r="55"
        fill="white"
    />


    <circle
        cx="390"
        cy="388"
        r="44"
        fill="#635bff"
    />


    <polyline
        points="
            364,388
            383,407
            419,367
        "
        fill="none"
        stroke="white"
        stroke-width="15"
        stroke-linecap="round"
        stroke-linejoin="round"
    />


    <!-- SMALL ACCENT -->

    <rect
        x="125"
        y="380"
        width="95"
        height="9"
        rx="4.5"
        fill="white"
        opacity="0.28"
    />

</svg>
